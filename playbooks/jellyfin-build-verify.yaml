---
# jellyfin-build-verify — gate 2 of 3: build the fork and assert the four named
# DLLs exist and expose the REAL patch surfaces (IChannelItemRefresh,
# IChannelItemRefreshManager, RefreshChannelItemAsync — NOT the nonexistent
# IItemActionProvider/Actions; see tools/zuul-ci/build-verify.sh + ARTIFACTS.md).
# All real logic lives in tools/zuul-ci/build-verify.sh.
#
# Honesty guard (see jellyfin-patch-apply.yaml): fail loudly on an empty
# inventory so a missing build node is an honest red, never a play that matches
# zero hosts and reports green without building.

- name: Guard — refuse to pass on an empty inventory (no build node)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Fail honestly when there is no build node (no suitable Nodepool label)
      ansible.builtin.fail:
        msg: >-
          No build node in the inventory (groups['all'] is empty). The jellyfin
          build+surface gate needs a real executor node with the .NET 9 SDK to
          `dotnet publish` the fork and grep the built DLLs, but this job
          declares no nodeset (flux's Nodepool provider serves only the
          buildah-only `pod-buildah` label, not a .NET-capable node), so no
          node was assigned. Refusing to report success on zero hosts. This
          job goes green once a general-purpose build node is added.
      when: groups['all'] | length == 0

- name: Build the fork + assert the four-DLL surfaces
  hosts: all
  tasks:
    - name: dotnet publish + surface assertions (no reusable build servers)
      ansible.builtin.shell:
        cmd: exec ./tools/zuul-ci/build-verify.sh
        chdir: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"
        executable: /bin/bash
      environment:
        MSBUILDDISABLENODEREUSE: "1"
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        DOTNET_NOLOGO: "1"
