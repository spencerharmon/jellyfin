# jellyfin (patched fork) — Gitea Actions image build + publish pipeline.
#
# SUCCESSOR to the removed Zuul pipeline (.zuul.yaml + playbooks/jellyfin-*.yaml).
# The hive INFRASTRUCTURE.md "CI / build pipelines" policy is explicit: Zuul is
# DEPRECATED and REMOVED — every pipeline now runs on the operator's self-hosted
# **Gitea Actions** runner, in CONTAINERS, defined in-repo under .gitea/workflows/.
# The already-DONE zuul-ci / zuul-image-build-publish tasks stay DONE (historical;
# the image they already published is unaffected) — this workflow supersedes only
# their Zuul MECHANISM, reusing the exact same verified CI logic in tools/zuul-ci/.
#
# CONTAINERIZED TOOLCHAIN (the whole point — never depend on a host-installed tool):
#   * the `verify` job runs in the pinned **.NET SDK 9** container
#     (mcr.microsoft.com/dotnet/sdk:9.0 — matches the fork's global.json
#     rollForward pin), so the patch-apply + DLL-surface build never needs a host
#     SDK. This is the exact fix for the pgsql-plugin-bundle failure class (a
#     `dotnet build` that only worked because a host SDK happened to be symlinked
#     in): pgsql-plugin-bundle depends on THIS task so its provider build runs in
#     this SDK-provisioned container instead of requiring a host .NET SDK.
#   * the `image` job runs in the **podman/buildah** container
#     (quay.io/podman/stable), so the deployable-image build + registry push never
#     needs a host container engine. The Dockerfile is self-contained multi-stage
#     (node + dotnet SDK inside), so buildah/podman is the only tool this job needs.
#
# CI CHECKS (mirror the retired zuul-ci scope, 1:1, same scripts):
#   1. tools/zuul-ci/patch-apply-verify.sh — the additive channel-refresh/item-action
#      patch applies IDEMPOTENTLY at the exact base tag and FAILS LOUD on any
#      non-applying hunk (never skip/special-case one).
#   2. tools/zuul-ci/build-verify.sh — build the fork and assert the four named DLLs
#      expose their REAL patch surfaces.
#   3. tools/zuul-ci/image-build.sh — build container-image's Dockerfile (build only,
#      no push) proving the deployable image still builds.
#
# PUBLISH (only on merge/push to the tracked branch, never on a PR):
#   push the built image to the in-cluster Gitea OCI registry under BOTH
#   namespaces as git.spencerharmon.com/images/jellyfin-phantom:<git-sha> (the
#   flux-driven `images/` namespace rename, ROI patched-image-oci-namespace-images-
#   migrate, 25b1fa16 — this is the namespace flux's blue/green repin now consumes)
#   AND git.spencerharmon.com/zuul/jellyfin-phantom:<git-sha> (the LEGACY namespace,
#   kept alongside so nothing already pinned to it breaks mid-migration) — both
#   registry-served, digest-addressable tags, **NEVER `:latest`**. Dual-publishing
#   the same digest under both refs is deliberate: this task (images-namespace-
#   image-publish) is the jellyfin-owned producer of the `images/` ref that flux's
#   migrate task found missing; it does not reopen or remove the legacy `zuul` ref,
#   which stays owned by `gitea-actions-image-workflow` (DONE) until flux's own
#   migration retires it. Verify-After-Merge confirms both tags are pullable via
#   the registry v2 API (gitea-oci-digest check).

name: jellyfin-image-build

on:
  push:
    branches:
      - phantom-library/patch-base-10.11.9
  pull_request:

env:
  # New, ROI-driven namespace: flux's blue/green repin consumes this ref
  # (patched-image-oci-namespace-images-migrate, 25b1fa16).
  IMAGE_REPO: git.spencerharmon.com/images/jellyfin-phantom
  # LEGACY registry namespace, kept alongside during the migration — owned by
  # `gitea-actions-image-workflow` (DONE); this workflow keeps publishing it too
  # so nothing still pinned to it breaks. NOT this task's to remove.
  LEGACY_IMAGE_REPO: git.spencerharmon.com/zuul/jellyfin-phantom
  REGISTRY_HOST: git.spencerharmon.com

jobs:
  # ---------------------------------------------------------------------------
  # CI checks — patch-apply idempotency + the four DLL surfaces. Runs in the
  # pinned .NET SDK 9 container so nothing depends on a host-installed SDK.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0
      # Egress note: this job restores from api.nuget.org. Outbound HTTPS from the
      # runner's docker-in-docker bridge previously blackholed (docker0 came up at
      # MTU 1500 while the flannel pod network is 1450 and PMTU ICMP is filtered),
      # so `dotnet restore` dead-waited ~2.5h to the job timeout (NU1301). Fixed at
      # the source in flux (gitea-actions dind `--mtu=1450`), so a plain bridged job
      # container now egresses normally — no per-job network override needed here.
      # (act_runner ignores a `--network=host` option on job containers anyway; it
      # attaches them to its configured `container.network`.)
    steps:
      # NOTE: `actions/checkout@v4` is a Node.js action, and this job runs
      # inside the plain `mcr.microsoft.com/dotnet/sdk:9.0` container (no node
      # binary) rather than the runner's own host env — the marketplace
      # action fails (`exec: "node": executable file not found`). A plain-shell
      # git clone needs nothing but git (already in the SDK base image) and
      # works in ANY container, so it replaces the action in every job below.
      # Full (unshallowed) history — patch-apply-verify.sh needs the base SHA
      # ancestry, which a shallow `--depth 1` clone would not carry.
      - name: Checkout (plain git — no node dependency)
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: patch-apply verification (idempotent, fail-loud)
        run: ./tools/zuul-ci/patch-apply-verify.sh
      - name: build the fork + assert the four patched DLL surfaces
        run: ./tools/zuul-ci/build-verify.sh

  # ---------------------------------------------------------------------------
  # Image build (always, as a check) + publish (merge/push to tracked branch
  # only). Runs in the podman/buildah container so nothing depends on a host
  # container engine.
  # ---------------------------------------------------------------------------
  image:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable
      # --privileged: podman needs user/mount namespaces for its rootless internal
      # builds (nested "clone"/mount syscalls) — without it, it fails immediately
      # with "cannot clone: Operation not permitted" before reading the Dockerfile.
      # Same fix already applied on the gostream image-publish job.
      # (Bridge egress itself is fixed at the flux dind `--mtu=1450` layer; the
      # Dockerfile RUN steps reach the internet via `podman build --network=host`
      # in image-build.sh, which reuses this job container's now-correct netns.)
      options: --privileged
    steps:
      # See the "verify" job's note above — the actions/checkout Node.js
      # action cannot run in this node-less container either. image-build.sh
      # only needs the checked-out tree, so a shallow clone is enough here.
      - name: Checkout (plain git — no node dependency)
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: build the deployable image (build only — proves it still builds)
        run: ./tools/zuul-ci/image-build.sh
      - name: publish to the Gitea OCI registry (merge only, never :latest)
        if: github.event_name == 'push'
        env:
          # The runner supplies a registry-push credential. Prefer an explicit
          # push token/secret; fall back to the automatic Actions token + actor.
          # NOTE: a name starting `GITEA_`/`GITHUB_` is a RESERVED secret-name
          # prefix on this Gitea Actions instance (create/update returns 400
          # "invalid variable or secret name") — use OCI_REGISTRY_* instead,
          # the same convention already configured on the gostream repo.
          REGISTRY_USER: ${{ secrets.OCI_REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.OCI_REGISTRY_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Registry-served, digest-addressable tag — the immutable git sha of the
          # merged tip. NEVER ':latest' (a mutable tag flux must not consume).
          TAG="$(git rev-parse --short=12 HEAD)"
          REF="${IMAGE_REPO}:${TAG}"
          LEGACY_REF="${LEGACY_IMAGE_REPO}:${TAG}"
          echo "publishing ${REF} and ${LEGACY_REF} (digest-addressable; never :latest)"
          podman login --username "${REGISTRY_USER}" --password "${REGISTRY_TOKEN}" "${REGISTRY_HOST}"
          # Re-tag the image image-build.sh already built (jellyfin-phantom:zuul-ci-check)
          # so we push exactly the artifact the checks proved buildable — no rebuild.
          # Push under BOTH the new `images/` namespace (flux's blue/green repin
          # target, ROI patched-image-oci-namespace-images-migrate) and the legacy
          # `zuul/` namespace (kept alongside so nothing already pinned to it
          # breaks mid-migration) — same digest, two refs.
          podman tag jellyfin-phantom:zuul-ci-check "${REF}"
          podman push "${REF}"
          echo "published ${REF}"
          podman tag jellyfin-phantom:zuul-ci-check "${LEGACY_REF}"
          podman push "${LEGACY_REF}"
          echo "published ${LEGACY_REF}"
