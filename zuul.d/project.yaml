---
# jellyfin (patched fork) — Zuul project-pipeline attachment.
#
# UNTRUSTED project: attach jobs ONLY to pipelines flux's Zuul config-project
# already defines (check / gate). Do NOT declare a `pipeline:` here, and do NOT
# set `name:` — it defaults to this repository, which is what we want. This is
# the same shape the beehive submodule's release-verify wiring and gostream's
# zuul-ci use.
#
# All three jobs are honestly gated on flux's not-yet-deployed Nodepool provider
# (see zuul.d/jobs.yaml): with no build node they fail red rather than faking
# green. They are attached to BOTH check and gate so the honest-red (or, once a
# Nodepool exists, real-green) signal blocks a broken change from merging.
#
# Cross-repo prerequisite (NOT this repo's change): for these jobs to load and
# run in the deployed tenant, flux must register spencerharmon/jellyfin under
# `untrusted-projects` in infrastructure/zuul/tenant-config.yaml. Tracked via the
# authorized jellyfin <-> flux submodule link; see docs/ci-zuul.md.

- project:
    check:
      jobs:
        - jellyfin-patch-apply
        - jellyfin-build-verify
        - jellyfin-image-build
    gate:
      jobs:
        - jellyfin-patch-apply
        - jellyfin-build-verify
        - jellyfin-image-build
